; Administrator deployment profile. Never place passwords in this file.
; Replace this LAN example with the deployment's verified endpoint, or import a .bvpn profile.
[VPN]
Server=https://192.168.19.254:4443
LockServer=0
; Optional: an administrator-verified OpenConnect pin-sha256:BASE64 value.
; Empty Pin + empty CAFile uses Windows certificate validation.
ServerPin=
; Optional PEM CA bundle, relative to this INI file or an absolute path.
CAFile=
AuthGroup=
PreferUDP=1
ReconnectSeconds=300
; Reject DNS requests leaving other adapters while the VPN is connected.
ProtectDNS=1
; Block IPv6 outside the tunnel when the server supplies no IPv6 address.
BlockUntunneledIPv6=1

[UI]
Language=auto
