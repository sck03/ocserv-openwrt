name: Lansyra
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.3'
    CURRENT_PROJECT_VERSION: '6'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Manual
targets:
  Lansyra:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VPN_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VPN_APP_PROFILE)
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../../client/apple/ServerAddress.h
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 岚序 Lansyra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, ../../client/apple]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VPN_BUNDLE_ID).tunnel
        PROVISIONING_PROFILE_SPECIFIER: $(VPN_TUNNEL_PROFILE)
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../build/mobile/ios/prefix/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../build/mobile/ios/prefix/lib
        OTHER_LDFLAGS: '-lopenconnect -lssl -lcrypto -lxml2 -lz -liconv -Wl,-dead_strip'
        CLANG_ENABLE_OBJC_ARC: YES
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: 岚序 Lansyra 隧道
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: PacketTunnelProvider
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
schemes:
  Lansyra:
    build:
      targets:
        Lansyra: all
