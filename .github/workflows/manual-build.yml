name: 手动构建客户端和 OpenWrt 服务端

on:
  workflow_dispatch:
    inputs:
      component:
        description: 构建内容 / Components
        type: choice
        default: all
        options:
          - all
          - client
          - server

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_JOBS: "2"
  PYTHONUTF8: "1"

jobs:
  validate:
    name: 源码与服务端回归检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Lua test runtime
        run: python -m pip install lupa==2.6
      - name: Check scripts and server transactions
        run: |
          python -m compileall -q scripts tests
          python tests/server_integration.py
          node --check server/openwrt/luci-app-ocserv-easy/htdocs/luci-static/resources/ocserv-easy/app.js
          for script in scripts/*.sh server/tools/*.sh; do bash -n "$script"; done
      - uses: actions/upload-artifact@v4
        with:
          name: server-regression-results
          path: test-results/server-regressions.json
          if-no-files-found: error
          retention-days: 7

  client:
    name: Windows ${{ matrix.arch }}（Linux 交叉编译）
    if: inputs.component != 'server'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MSVCRT cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl pkg-config autoconf automake libtool gettext \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix \
            mingw-w64-common curl xz-utils unzip python3
      - name: Build static client and audit Windows imports
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p test-results
          bash scripts/build-client-linux.sh "$TARGET_ARCH" 2>&1 | tee "test-results/build-client-$TARGET_ARCH.log"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/BulijieVPN-*-windows-*.zip
            dist/SHA256SUMS-windows-*.txt
            dist/validation-*/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: client-build-log-${{ matrix.arch }}
          path: test-results/*.log
          retention-days: 7

  server:
    name: OpenWrt ${{ matrix.branch }} / aarch64_generic
    if: inputs.component != 'client'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        branch: ["24.10", "25.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd patch cpio
      - name: Verify and extract matching SDK
        env:
          SDK_BRANCH: ${{ matrix.branch }}
        run: python3 scripts/fetch-sdk.py "$SDK_BRANCH"
      - name: Build ocserv 1.5.0 and Chinese LuCI packages
        env:
          SDK_BRANCH: ${{ matrix.branch }}
        run: |
          mkdir -p test-results
          bash server/tools/build-ocserv.sh "$PWD/.tools/sdk-$SDK_BRANCH" 2>&1 | tee "test-results/build-server-$SDK_BRANCH.log"
          python3 scripts/package-server.py "$SDK_BRANCH" "$PWD/.tools/sdk-$SDK_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.branch }}-aarch64_generic
          path: dist/ocserv-1.5.0-openwrt-*/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-build-log-${{ matrix.branch }}
          path: test-results/*.log
          retention-days: 7

  source:
    name: 客户端对应源码
    needs: validate
    if: inputs.component != 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle pinned dependency sources and build scripts
        run: |
          python3 scripts/fetch-sources.py --download-only
          python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          path: |
            dist/BulijieVPN-*-source.zip
            dist/SHA256SUMS-source.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
