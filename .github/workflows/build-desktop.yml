name: 手动构建 macOS 和 Linux 桌面客户端
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux ${{ matrix.arch }} (Debian 12 / Ubuntu 24.04)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12-slim
    timeout-minutes: 25
    steps:
      - name: Install current desktop build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config python3 \
            libgtk-3-dev libnm-dev libsecret-1-dev network-manager-openconnect-gnome \
            dbus-x11 xvfb xauth desktop-file-utils fonts-noto-cjk
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/linux/*.deb
            dist/linux/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.arch == 'amd64'
        with:
          name: linux-source
          path: dist/linux-source/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-validation-${{ matrix.arch }}
          path: |
            test-results/linux-window.png
            test-results/linux-package.json
            build/desktop/linux-${{ matrix.arch }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
  linux-install:
    name: Install Linux ${{ matrix.arch }} on ${{ matrix.distro }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [debian12, ubuntu2404]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - distro: debian12
            image: debian:12-slim
          - distro: ubuntu2404
            image: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: Install verification tools without development libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates python3 binutils dbus-x11 xvfb xauth
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install through APT and launch the packaged client
        run: |
          cd dist/linux
          sha256sum -c SHA256SUMS.txt
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./linkora-vpn_*.deb
          cd ../..
          python3 tests/linux_package_tests.py dist/linux/linkora-vpn_*.deb
          /usr/bin/linkora-vpn --version
          NO_AT_BRIDGE=1 xvfb-run -a dbus-run-session -- /usr/bin/linkora-vpn --smoke-test
          test -x /usr/lib/NetworkManager/nm-openconnect-auth-dialog
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-install-validation-${{ matrix.arch }}-${{ matrix.distro }}
          path: test-results/linux-*
          if-no-files-found: ignore
          retention-days: 7
  macos:
    name: macOS 13+ Universal (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config cmake xcodegen
          python3 -m pip install --disable-pip-version-check Pillow
      - name: Verify shared Apple validation
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc -framework Foundation tests/ios_connection_tests.m -o "$RUNNER_TEMP/apple-address-tests"
          "$RUNNER_TEMP/apple-address-tests"
          cc -Wall -Wextra -Werror -std=c11 tests/mobile_protocol_tests.c -o "$RUNNER_TEMP/apple-packet-tests"
          "$RUNNER_TEMP/apple-packet-tests"
          bash -n scripts/build-apple-core.sh scripts/build-macos.sh scripts/build-linux.sh
      - uses: actions/cache@v6.1.0
        with:
          path: .tools/mobile-downloads
          key: mobile-sources-${{ hashFiles('mobile/sources.json') }}
      - name: Build both CPU architectures and the packet tunnel extension
        run: bash scripts/build-macos.sh unsigned
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-universal-unsigned
          path: |
            dist/macos/LinkoraVPN-*-macos-universal-unsigned.zip
            dist/macos/BUILDINFO.json
            dist/macos/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-source
          path: dist/macos-source/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: macos-configure-logs
          path: build/desktop/macos/*/oc-build/config.log
          if-no-files-found: ignore
          retention-days: 7
