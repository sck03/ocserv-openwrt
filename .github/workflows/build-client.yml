name: 手动构建 Windows 客户端

on:
  workflow_dispatch:
    inputs:
      openconnect_version:
        description: OpenConnect 官方协议核心版本
        type: string
        default: "9.21"
      openconnect_sha256:
        description: 更换核心版本时必填官方源码 tar.gz 的 SHA-256
        type: string
        default: ""
      build_jobs:
        description: 并行任务数，auto 使用运行器全部可用 CPU
        type: string
        default: "auto"
      publish_release:
        description: 全部检查通过后发布到 Releases（仅 main）
        type: boolean
        default: true

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false
env:
  BUILD_JOBS: ${{ inputs.build_jobs }}
  PYTHONUTF8: "1"

jobs:
  validate:
    name: 检查构建参数和脚本
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validate inputs and release scripts
        env:
          CORE_VERSION: ${{ inputs.openconnect_version }}
          CORE_SHA256: ${{ inputs.openconnect_sha256 }}
        run: |
          [[ "$BUILD_JOBS" == auto || "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid build_jobs'; exit 2; }
          python3 -m compileall -q scripts tests client/tests
          python3 tests/build_config_tests.py
          python3 tests/release_tests.py
          python3 tests/client_build_tests.py
          node client/tests/script_tests.js
          python3 scripts/prepare-build.py client --version "$CORE_VERSION" --sha256 "$CORE_SHA256"
          bash -n scripts/build-client-linux.sh scripts/build-dependencies.sh scripts/publish-release.sh

  client:
    name: Windows ${{ matrix.arch }}（Linux 编译）
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select official OpenConnect source
        env:
          CORE_VERSION: ${{ inputs.openconnect_version }}
          CORE_SHA256: ${{ inputs.openconnect_sha256 }}
        run: python3 scripts/prepare-build.py client --version "$CORE_VERSION" --sha256 "$CORE_SHA256"
      - name: Install MSVCRT cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl pkg-config autoconf automake libtool gettext \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix \
            mingw-w64-common patch xz-utils python3
      - name: Cache verified source archives
        uses: actions/cache@v6.1.0
        with:
          path: .tools/downloads
          key: client-sources-${{ hashFiles('scripts/sources.json') }}
      - name: Cache static dependencies
        uses: actions/cache@v6.1.0
        with:
          path: .deps/${{ matrix.arch }}
          key: client-static-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/sources.json', 'scripts/build-dependencies.sh', 'scripts/build_common.py', 'scripts/fetch-sources.py', 'scripts/source-directory.py', 'client/patches/*.patch') }}
      - name: Build and audit portable client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p test-results
          bash scripts/build-client-linux.sh "$TARGET_ARCH" 2>&1 | tee "test-results/build-client-$TARGET_ARCH.log"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/BulijieVPN-*-windows-*.zip
            dist/SHA256SUMS-windows-*.txt
            dist/validation-*/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: client-build-log-${{ matrix.arch }}
          path: test-results/*.log
          retention-days: 7

  windows-tests:
    name: Windows 原生运行回归（x64 和 x86）
    needs: client
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - name: Install test-only certificate tools
        run: python -m pip install --disable-pip-version-check -r client/tests/requirements.txt
      - name: Run UI, profiles and loopback authentication tests
        run: |
          foreach ($arch in @('x64', 'x86')) {
            $packages = @(Get-ChildItem -Path "dist/BulijieVPN-*-windows-$arch.zip")
            if ($packages.Count -ne 1) { throw "Expected one $arch package" }
            python scripts/test-client.py --build "dist/validation-$arch" --package $packages[0].FullName --output "test-results/client-$arch"
            if ($LASTEXITCODE) { throw "Client regressions failed: $arch" }
          }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: client-windows-regressions
          path: test-results/client-*/
          if-no-files-found: error
          retention-days: 7

  source:
    name: 客户端对应源码
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bundle checksum-pinned sources
        env:
          CORE_VERSION: ${{ inputs.openconnect_version }}
          CORE_SHA256: ${{ inputs.openconnect_sha256 }}
        run: |
          python3 scripts/prepare-build.py client --version "$CORE_VERSION" --sha256 "$CORE_SHA256"
          python3 scripts/fetch-sources.py --download-only
          python3 scripts/package-source.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: corresponding-source
          path: |
            dist/BulijieVPN-*-source.zip
            dist/SHA256SUMS-source.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: 发布客户端到 Releases
    needs: [windows-tests, source]
    if: ${{ inputs.publish_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: corresponding-source
          path: dist
      - name: Collect both architectures and corresponding source
        run: |
          mkdir -p release-assets
          cp dist/BulijieVPN-*-windows-x64.zip dist/BulijieVPN-*-windows-x86.zip \
            dist/BulijieVPN-*-source.zip release-assets/
          cat dist/SHA256SUMS-windows-x64.txt dist/SHA256SUMS-windows-x86.txt \
            dist/SHA256SUMS-source.txt > release-assets/SHA256SUMS.txt
      - name: Publish verified client assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh client release-assets
