name: 手动构建 Android 客户端
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: debug 可直接测试；release 需要 Android 签名 Secrets
        type: choice
        options: [debug, release]
        default: debug
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check mobile build contracts
        run: |
          python3 tests/mobile_build_tests.py
          bash -n scripts/build-android.sh scripts/build-ios-core.sh scripts/build-ios.sh
      - name: Install native tools and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: .tools/mobile-downloads
          key: mobile-sources-${{ hashFiles('mobile/sources.json') }}
      - name: Build native core and APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/bulijie-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          if [[ "$BUILD_TYPE" == release ]]; then
            test -n "$ANDROID_KEYSTORE_BASE64"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
          fi
          bash scripts/build-android.sh "$BUILD_TYPE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/android/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/android/*.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-${{ inputs.build_type }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: android-build-logs
          path: build/mobile/android/app/native/build/**/work/*.log
          retention-days: 7
