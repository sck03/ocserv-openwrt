name: 手动构建 ocserv 服务端与中文管理页

on:
  workflow_dispatch:
    inputs:
      ocserv_version:
        description: ocserv 官方源码版本（至少 1.5.0）
        type: string
        default: "1.5.0"
      ocserv_sha256:
        description: 改用其他版本时必填：官方源码 tar.xz 的 SHA-256；默认版本可留空
        type: string
        default: ""
      series:
        description: 构建哪个 OpenWrt 系列
        type: choice
        default: all
        options:
          - all
          - "24"
          - "25"
      sdk_24_version:
        description: OpenWrt 24.x.x SDK 版本；填 auto 选择本系列最新稳定版
        type: string
        default: "24.10.8"
      sdk_25_version:
        description: OpenWrt 25.x.x SDK 版本；填 auto 选择本系列最新稳定版
        type: string
        default: "25.12.5"

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: server-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  BUILD_JOBS: "2"
  PYTHONUTF8: "1"

jobs:
  validate:
    name: 服务端与构建参数回归
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - run: python -m pip install lupa==2.8
      - name: Validate source and service transactions
        env:
          OCSERV_VERSION: ${{ inputs.ocserv_version }}
          OCSERV_SHA256: ${{ inputs.ocserv_sha256 }}
        run: |
          python -m compileall -q scripts tests
          python tests/build_config_tests.py
          python tests/release_tests.py
          python scripts/prepare-build.py server --version "$OCSERV_VERSION" --sha256 "$OCSERV_SHA256"
          python tests/server_integration.py
          node --check server/openwrt/luci-app-ocserv-easy/htdocs/luci-static/resources/ocserv-easy/app.js
          for script in server/tools/*.sh; do bash -n "$script"; done
          bash -n scripts/publish-release.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: server-regression-results
          path: test-results/server-regressions.json
          if-no-files-found: error
          retention-days: 7

  server:
    name: OpenWrt ${{ matrix.series }}.x.x / aarch64_generic
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(inputs.series == 'all' && '["24","25"]' || format('["{0}"]', inputs.series)) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select official ocserv source
        env:
          OCSERV_VERSION: ${{ inputs.ocserv_version }}
          OCSERV_SHA256: ${{ inputs.ocserv_sha256 }}
        run: python3 scripts/prepare-build.py server --version "$OCSERV_VERSION" --sha256 "$OCSERV_SHA256"
      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd patch cpio
      - name: Verify and extract the selected SDK
        env:
          SDK_SERIES: ${{ matrix.series }}
          SDK_VERSION: ${{ matrix.series == '24' && inputs.sdk_24_version || inputs.sdk_25_version }}
        run: python3 scripts/fetch-sdk.py "$SDK_SERIES" --version "$SDK_VERSION" --output "$RUNNER_TEMP/sdk-$SDK_SERIES"
      - name: Build ocserv and Chinese LuCI packages
        env:
          SDK_SERIES: ${{ matrix.series }}
        run: |
          mkdir -p test-results
          bash server/tools/build-ocserv.sh "$RUNNER_TEMP/sdk-$SDK_SERIES" 2>&1 | tee "test-results/build-server-$SDK_SERIES.log"
          python3 scripts/package-server.py "$RUNNER_TEMP/sdk-$SDK_SERIES"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-${{ matrix.series }}.x-aarch64_generic
          path: |
            dist/ocserv-*-openwrt-*.zip
            dist/SHA256SUMS-openwrt-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: server-build-log-${{ matrix.series }}
          path: test-results/*.log
          retention-days: 7

  release:
    name: 发布服务端到 Releases
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: openwrt-*.x-aarch64_generic
          path: dist
          merge-multiple: true
      - name: Collect selected SDK bundles and checksums
        run: |
          mkdir -p release-assets
          cp dist/ocserv-*-openwrt-*.zip release-assets/
          cat dist/SHA256SUMS-openwrt-*.txt > release-assets/SHA256SUMS.txt
      - name: Publish verified server assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh server release-assets
