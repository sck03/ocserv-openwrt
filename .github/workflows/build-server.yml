name: 手动构建 ocserv 服务端与中文管理页

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 发布版本号（如 1.5.0）；留空使用北京时间日期和时分秒
        type: string
        default: ""
      ocserv_version:
        description: ocserv 官方源码版本（至少 1.5.0）
        type: string
        default: "1.5.0"
      ocserv_sha256:
        description: 改用其他版本时必填：官方源码 tar.xz 的 SHA-256；默认版本可留空
        type: string
        default: ""
      sdk_version:
        description: OpenWrt 25.12.x SDK 版本；填 auto 选择 25.12 系列最新稳定版
        type: string
        default: "auto"
      build_jobs:
        description: 并行编译任务数；auto 使用运行器全部可用 CPU，也可填写正整数
        type: string
        default: "auto"
      publish_release:
        description: 全部检查通过后发布到 Releases（仅 main）
        type: boolean
        default: true

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false
env:
  BUILD_JOBS: ${{ inputs.build_jobs || 'auto' }}
  PYTHONUTF8: "1"

jobs:
  validate:
    name: 服务端与构建参数回归
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      build_timestamp: ${{ steps.metadata.outputs.build_timestamp }}
      sdk_version: ${{ steps.sdk.outputs.version }}
      matrix: ${{ steps.sdk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Resolve release version and build time
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release_metadata.py --github-output
      - name: Resolve and validate SDK before building
        id: sdk
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: python3 scripts/sdk_config.py --version "$SDK_VERSION" --github-output
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          check-latest: true
          package-manager-cache: false
      - run: python -m pip install lupa==2.8
      - name: Validate source and service transactions
        env:
          OCSERV_VERSION: ${{ inputs.ocserv_version }}
          OCSERV_SHA256: ${{ inputs.ocserv_sha256 }}
        run: |
          [[ "$BUILD_JOBS" == auto || "$BUILD_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid build_jobs'; exit 2; }
          python -m compileall -q scripts tests
          python tests/build_config_tests.py
          python tests/release_tests.py
          python tests/release_metadata_tests.py
          python tests/server_package_tests.py
          python scripts/prepare-build.py server --version "$OCSERV_VERSION" --sha256 "$OCSERV_SHA256"
          python tests/server_integration.py
          python tests/server_config_tests.py
          python tests/guard_integration.py
          python tests/process_tests.py
          python tests/server_install_tests.py
          python tests/server_userfile_tests.py
          node --check server/openwrt/luci-app-ocserv-easy/htdocs/luci-static/resources/ocserv-easy/app.js
          for script in server/tools/*.sh; do bash -n "$script"; done
          bash -n scripts/publish-release.sh
      - name: Validate VPN-only firewall in isolated network namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 gnutls-bin openssl
          python3 tests/server_certificate_tests.py
          sudo python3 tests/vpn_guard_tests.py 2>&1 | tee test-results/vpn-guard-tests.log
      - name: Validate management page and stalled requests
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tests/server_preview.py --port 22981 > test-results/server-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:22981/ >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:22981/ >/dev/null || { cat test-results/server-preview.log; exit 1; }
          python tests/server_ui_tests.py --browser-channel chromium
          python tests/server_polling_tests.py --browser-channel chromium
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: server-regression-results
          path: |
            test-results/server-regressions.json
            test-results/guard-transactions.json
            test-results/server-certificates.json
            test-results/server-install.json
            test-results/server-userfile.json
            test-results/vpn-guard-tests.log
            test-results/server-ui-v041/
            test-results/server-polling.json
            test-results/server-preview.log
          if-no-files-found: error
          retention-days: 7

  server:
    name: OpenWrt 25.12 / ${{ matrix.target }} / APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      BUILD_TIMESTAMP: ${{ needs.validate.outputs.build_timestamp }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Select official ocserv source
        env:
          OCSERV_VERSION: ${{ inputs.ocserv_version }}
          OCSERV_SHA256: ${{ inputs.ocserv_sha256 }}
        run: python3 scripts/prepare-build.py server --version "$OCSERV_VERSION" --sha256 "$OCSERV_SHA256"
      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd patch cpio
      - name: Verify and extract the selected SDK
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
          SDK_TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch-sdk.py --version "$SDK_VERSION" --target "$SDK_TARGET" --output "$RUNNER_TEMP/sdk-25.12"
      - name: Build ocserv and Chinese LuCI packages
        run: |
          mkdir -p test-results
          bash server/tools/build-ocserv.sh "$RUNNER_TEMP/sdk-25.12" 2>&1 | tee test-results/build-server-25.12.log
          python3 scripts/package-server.py "$RUNNER_TEMP/sdk-25.12"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-25.12-${{ matrix.architecture }}
          path: |
            dist/LinkoraVPN-server-ocserv-*-openwrt-*.zip
            dist/SHA256SUMS-openwrt-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: server-build-log-25.12-${{ matrix.architecture }}
          path: test-results/*.log
          retention-days: 7

  release:
    name: 发布服务端到 Releases
    needs: [validate, server]
    if: ${{ inputs.publish_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      BUILD_TIMESTAMP: ${{ needs.validate.outputs.build_timestamp }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: openwrt-25.12-*
          path: dist
          merge-multiple: true
      - name: Collect selected SDK bundles and checksums
        run: |
          mkdir -p release-assets
          cp dist/LinkoraVPN-server-ocserv-*-openwrt-*.zip release-assets/
          cat dist/SHA256SUMS-openwrt-*.txt > release-assets/SHA256SUMS.txt
      - name: Publish verified server assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh server release-assets
