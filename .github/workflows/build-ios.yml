name: 手动构建 iOS 客户端
on:
  workflow_dispatch:
    inputs:
      signing:
        description: unsigned 编译验证；signed 导出 Ad Hoc IPA（需要 Apple 签名 Secrets）
        type: choice
        options: [unsigned, signed]
        default: unsigned
      bundle_id:
        description: Apple App ID；扩展为该 ID 加 .tunnel
        type: string
        default: io.github.sck03.linkoravpn
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config cmake xcodegen
      - name: Check mobile build contracts
        run: |
          python3 tests/mobile_build_tests.py
          cc -Wall -Wextra -Werror -std=c11 tests/mobile_protocol_tests.c -o "$RUNNER_TEMP/mobile-protocol-tests"
          "$RUNNER_TEMP/mobile-protocol-tests"
          clang -Wall -Wextra -Werror -fobjc-arc -framework Foundation tests/ios_connection_tests.m -o "$RUNNER_TEMP/ios-connection-tests"
          "$RUNNER_TEMP/ios-connection-tests"
          bash -n scripts/build-ios-core.sh scripts/build-ios.sh
          xcodebuild -version
      - uses: actions/cache@v6.1.0
        with:
          path: .tools/mobile-downloads
          key: mobile-sources-${{ hashFiles('mobile/sources.json') }}
      - name: Compile app and Network Extension
        env:
          SIGNING: ${{ inputs.signing }}
          VPN_BUNDLE_ID: ${{ inputs.bundle_id }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROFILE_BASE64 }}
        run: bash scripts/build-ios.sh "$SIGNING"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-${{ inputs.signing }}
          path: |
            dist/ios/*.zip
            dist/ios/*.ipa
            dist/ios/*.json
            dist/ios/*.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ios-configure-logs
          path: build/mobile/ios/oc-build/config.log
          if-no-files-found: ignore
          retention-days: 7
